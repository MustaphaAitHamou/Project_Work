# Tamurt Jobs — Nginx in front of the Node.js server (127.0.0.1:3000).
# Replace jobs.example.com with the production domain. TLS certificates: Let's Encrypt
# (certbot, webroot method). Before the first certificate exists, use tamurt-jobs-bootstrap.conf.

upstream tamurt_jobs {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Requests for any other host name (scanners, forged Host headers) are dropped.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # Same options as the other 443 blocks (http2), otherwise Nginx warns "protocol options redefined".
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    ssl_reject_handshake on;
    return 444;
}

# HTTP → HTTPS, always towards the main name (one redirect, www included).
server {
    listen 80;
    listen [::]:80;
    server_name jobs.example.com www.jobs.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://jobs.example.com$request_uri;
    }
}

# www → main name. The certificate covers both (certbot -d <domaine> -d www.<domaine>).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.jobs.example.com;

    ssl_certificate /etc/letsencrypt/live/jobs.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobs.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    return 301 https://jobs.example.com$request_uri;
}

server {
    # "listen … http2" works with the Nginx of Ubuntu 24.04 (1.24) and Debian 12 (1.22);
    # from Nginx 1.25.1, "http2 on;" is the newer spelling.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jobs.example.com;

    ssl_certificate /etc/letsencrypt/live/jobs.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobs.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    # CV (4 Mo maximum) and verification documents, with a margin.
    client_max_body_size 12m;
    # The Supabase session travels in large cookies (several kilobytes): with Nginx's default
    # buffers, every sign-in and e-mail confirmation fails with "502 Bad Gateway"
    # ("upstream sent too big header"), and the next requests with "400 Request Header Or
    # Cookie Too Large". Both directions get room for them.
    large_client_header_buffers 8 32k;
    proxy_buffer_size 32k;
    proxy_buffers 16 32k;
    proxy_busy_buffers_size 64k;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # Build files (unique names): served by Nginx, cached for a year. They are kept across
    # releases in shared/ so that a page opened before a deployment keeps working.
    location /_next/static/ {
        alias /srv/tamurt-jobs/shared/_next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://tamurt_jobs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Exact host sent by the browser (with its port, if any): Next.js compares it with the
        # Origin header of every form submission (Server Actions) and refuses a mismatch.
        proxy_set_header Host $http_host;
        # The visitor's address, overwritten (never appended): the application reads
        # X-Real-IP (CLIENT_IP_HEADER=x-real-ip) for rate limits and the anti-robot check.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
