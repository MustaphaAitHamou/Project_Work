# Tamurt Jobs — first start only: answers the Let's Encrypt challenge before the certificate
# exists. Replace it with tamurt-jobs.conf once `certbot certonly --webroot` has succeeded.
server {
    listen 80;
    listen [::]:80;
    server_name jobs.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 503;
    }
}
