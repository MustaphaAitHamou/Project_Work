name: Préproduction (Vercel)

# Every push to the pre-production branch runs the full CI, then (only if it passes) deploys
# that exact commit to the Vercel pre-production project. Vercel's own Git deployments are
# switched off in vercel.json, so untested code never reaches the pre-production site.
#
# The deployment is made through the Vercel API from the Git source (scripts/vercel-deploy-preprod.sh):
# Vercel builds the commit with the project's own settings and secrets (Supabase, Stripe test,
# Turnstile…), which never transit through GitHub.
#
# GitHub → Settings → Environments → "preprod" (step-by-step guide: docs/DEPLOYMENT_PREPROD.md):
#   variables VERCEL_ORG_ID (team id), VERCEL_PROJECT_ID, PREPROD_URL (https://<project>.vercel.app)
#   secrets   VERCEL_TOKEN (token limited to the Vercel team of the project, with an expiry date)
#             VERCEL_AUTOMATION_BYPASS_SECRET (optional: Vercel → Settings → Deployment Protection →
#             Protection Bypass for Automation; lets this workflow call /api/health through
#             Vercel Authentication, which stays enabled)
#
# A run only counts as a deployment when the "Deploy" step ran and the deployment is READY on the
# commit of the run, served by the pre-production alias and still protected: when the GitHub
# environment is not configured the job FAILS (it never reports success without deploying).

on:
  push:
    branches: [claude/jobs-lancement]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-preprod
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Vercel (pre-production)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: preprod
      url: ${{ vars.PREPROD_URL }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      PREPROD_URL: ${{ vars.PREPROD_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Vercel access configured
        run: |
          missing=""
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Pre-production NOT deployed: missing in the GitHub environment 'preprod':$missing"
            { echo "### Préproduction NON déployée"; echo "Manquant dans l'environnement GitHub « preprod » :$missing (voir docs/DEPLOYMENT_PREPROD.md)"; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/vercel-deploy-preprod.sh
          sparse-checkout-cone-mode: false
      - name: Deploy this commit, then check READY, commit, alias, protection and health
        env:
          GIT_REPOSITORY: ${{ github.repository }}
          GIT_REF: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: bash scripts/vercel-deploy-preprod.sh
