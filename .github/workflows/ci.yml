name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests (validation, files, e-mails, permissions parity, translations completeness)
        run: npm run test:unit

  database-e2e:
    name: Database, integration and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase (Postgres, Auth, Storage, Mailpit)
        run: npm run supabase:start
      # Keys of the throw-away local stack only; nothing secret is used in CI.
      - name: Generate local environment files
        run: npm run test:env -- --app
      - name: Lint SQL functions
        run: npm run db:lint
      - name: Generated database types are up to date
        run: npm run db:types && git diff --exit-code src/lib/supabase/database.types.ts
      - name: Integration tests (RLS, one-click apply, billing lifecycle)
        run: npm run test:integration
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (candidate, employer, Stripe webhook, back-office, scheduled jobs, accessibility)
        run: npm run test:e2e -- --trace off
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Stop Supabase
        if: always()
        run: npm run supabase:stop
